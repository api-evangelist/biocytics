aid: biocytics
name: BioCytics
description: >-
  BioCytics, Inc. is a privately held biotechnology company in Huntersville, North Carolina, founded
  in 2005 by John Powderly, MD, CPI, and clinically incubated by the co-located Carolina BioOncology
  Institute cancer research clinic. Its name means "applications of living cells": the company runs a
  Human Applications Laboratory (HAL), a patient-driven and industry-driven BioBank, and a
  BioInformatics group, and sells cGMP cell-therapy manufacturing (CDMO), early-phase CRO services,
  clinical lab diagnostics and translational analytical services alongside its own autologous adaptive
  immune cell therapy (AAICT) pipeline for solid tumors. Its BioDICE platform — BioCytics Digitally
  Integrated Clinical Enterprise — is an internal EMR / EDC-CDM / lab-documentation / CTMS suite whose
  product page names openEHR, HL7, FHIR, OMOP and SMART-on-FHIR as the data standards it works with,
  and openEHR International lists BioCytics as a Bronze industry partner. None of that is exposed:
  BioCytics publishes no developer program, no public API, and no machine-readable API contract of any
  kind, and biocytics.com is a 26-page WordPress site whose only machine-readable surface is the CMS's
  own unadvertised /wp-json/ index.
